[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kneemri"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection (Kaggle 2026): 2.5D multi-series attention-MIL pipeline"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.3",
  "torch>=2.2", "torchvision>=0.17", "timm>=0.9.12",
  "pydicom>=2.4", "opencv-python-headless>=4.8", "tqdm>=4.66", "pyyaml>=6.0",
]

[project.optional-dependencies]
dicom = ["pylibjpeg>=2.0", "pylibjpeg-libjpeg>=2.0", "pylibjpeg-openjpeg>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "nbformat>=5.9", "jupytext>=1.16", "kaggle>=1.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
